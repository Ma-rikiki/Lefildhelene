<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Fil d'Hélène · Créer un jeu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #041019;
      --surface: #0a1f2d;
      --surface-2: #123045;
      --border: rgba(173, 223, 247, 0.18);
      --text: #edf8ff;
      --muted: #9fc5d7;
      --accent: #6de0d6;
      --gold: #d9bb72;
      --danger: #ff7e7e;
      --success: #79f0b7;
      --radius-md: .8rem;
      --radius-lg: 1.25rem;
      --radius-full: 9999px;
      --space-2: .5rem;
      --space-3: .75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: radial-gradient(circle at top, rgba(109,224,214,0.12), transparent 25%), linear-gradient(180deg, #061824 0%, #020911 100%);
      color: var(--text);
    }

    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }

    .shell {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(4, 15, 23, 0.9);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
      padding: 1rem 0;
    }

    h1 {
      font-size: clamp(1.2rem, 1rem + 1vw, 1.8rem);
      margin: 0;
    }

    .small {
      color: var(--muted);
      font-size: .85rem;
    }

    main {
      padding: 2rem 0 3rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 1.5rem;
    }

    .card {
      background: rgba(10, 31, 45, 0.95);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.5rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.32);
    }

    .card h2 {
      margin: 0 0 1rem;
      font-size: clamp(1.2rem, 1rem + 0.9vw, 1.8rem);
    }

    .card h3 {
      margin: 0 0 .7rem;
      font-size: 1.05rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      margin-bottom: .45rem;
      color: var(--muted);
      font-size: .95rem;
    }

    input, textarea {
      width: 100%;
      background: rgba(4, 15, 23, 0.9);
      border: 1px solid var(--border);
      border-radius: .8rem;
      color: var(--text);
      padding: .85rem 1rem;
      resize: vertical;
    }

    textarea {
      min-height: 120px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 1rem;
    }

    button {
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: .8rem 1.3rem;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--accent), var(--gold));
      color: #041019;
      border-color: transparent;
      font-weight: 800;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.02);
    }

    .status {
      min-height: 1.5rem;
      margin-top: 1rem;
      color: var(--muted);
      font-size: .9rem;
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--danger); }

    .list {
      display: grid;
      gap: .75rem;
      max-height: 420px;
      overflow: auto;
      padding-right: .25rem;
    }

    .item {
      background: rgba(18, 48, 69, 0.9);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 1rem;
      padding: .9rem 1rem;
    }

    .item strong {
      display: block;
      margin-bottom: .35rem;
      line-height: 1.5;
    }

    .item .meta {
      color: var(--muted);
      font-size: .8rem;
      margin-top: .35rem;
    }

    .empty {
      color: var(--muted);
      padding: 1rem;
      border: 1px dashed var(--border);
      border-radius: 1rem;
      background: rgba(255,255,255,0.01);
    }

    .preview-box {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(4,15,23,0.7);
      border: 1px solid var(--border);
      border-radius: 1rem;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      margin-bottom: .75rem;
      flex-wrap: wrap;
    }

    .preview-question {
      font-size: 1.1rem;
      line-height: 1.7;
      margin: 0 0 .75rem;
    }

    .preview-input {
      margin-top: 1rem;
    }

    .preview-feedback {
      min-height: 1.25rem;
      margin-top: .6rem;
      font-size: .9rem;
    }

    .score {
      color: var(--muted);
      font-size: .9rem;
      margin-top: 1rem;
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell top">
      <div>
        <h1>Le Fil d'Hélène · Créer un jeu</h1>
        <div class="small">Concevez une nouvelle série d'énigmes en quelques clics.</div>
      </div>
      <a href="index.html" class="btn btn-secondary">⬅ Accueil</a>
    </div>
  </header>

  <main class="shell">
    <div class="layout">
      <section class="card">
        <h2>Créer un nouveau jeu</h2>

        <label for="gameTitle">Nom du jeu</label>
        <input id="gameTitle" type="text" placeholder="Ex. : Le Secret du Port" />

        <label for="question">Énigme</label>
        <textarea id="question" placeholder="Écrivez votre énigme ici…"></textarea>

        <label for="answer">Réponse</label>
        <input id="answer" type="text" placeholder="Réponse attendue" />

        <div class="actions">
          <button id="addEnigmaBtn" class="btn-primary">Ajouter l'énigme</button>
          <button id="saveGameBtn" class="btn-secondary">Enregistrer le jeu</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section class="card">
        <h3>Énigmes ajoutées</h3>
        <div id="enigmaList" class="list"></div>
      </section>
    </div>

    <section class="card preview-box">
      <div class="preview-header">
        <h3 id="previewTitle">Prévisualisation du jeu</h3>
        <button id="startPreviewBtn" class="btn-secondary">Lancer le test</button>
      </div>

      <div id="previewContent">
        <div class="empty">Aucune énigme créée pour le moment. Ajoutez-en une pour tester le jeu.</div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'le_fil_helene_custom_game';
    const gameTitleInput = document.getElementById('gameTitle');
    const questionInput = document.getElementById('question');
    const answerInput = document.getElementById('answer');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('enigmaList');
    const previewTitleEl = document.getElementById('previewTitle');
    const previewContentEl = document.getElementById('previewContent');

    let currentGame = {
      title: '',
      enigmas: []
    };

    let previewIndex = 0;
    let previewScore = 0;
    let previewAnswered = false;

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = 'status';
      if (type) statusEl.classList.add(type);
    }

    function loadGame() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;

      try {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.enigmas)) {
          currentGame = {
            title: parsed.title || '',
            enigmas: parsed.enigmas
          };
          gameTitleInput.value = currentGame.title;
        }
      } catch (error) {
        console.error('Impossible de charger le jeu enregistré', error);
      }
    }

    function saveGame() {
      currentGame.title = gameTitleInput.value.trim();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentGame));
    }

    function renderList() {
      if (!currentGame.enigmas.length) {
        listEl.innerHTML = '<div class="empty">Aucune énigme enregistrée.</div>';
        return;
      }

      listEl.innerHTML = currentGame.enigmas.map((enigma, index) => `
        <div class="item">
          <strong>${index + 1}. ${enigma.text}</strong>
          <div class="meta">Réponse : ${enigma.answer}</div>
          <div class="actions" style="margin-top: .6rem;">
            <button class="btn-secondary" data-delete-id="${enigma.id}">Supprimer</button>
          </div>
        </div>
      `).join('');
    }

    function updatePreviewTitle() {
      const gameName = currentGame.title || 'Mon jeu d’énigmes';
      previewTitleEl.textContent = `${gameName} — Prévisualisation`;
    }

    function renderPreview() {
      updatePreviewTitle();

      if (!currentGame.enigmas.length) {
        previewContentEl.innerHTML = '<div class="empty">Aucune énigme créée pour le moment. Ajoutez-en une pour tester le jeu.</div>';
        return;
      }

      const enigma = currentGame.enigmas[previewIndex];
      previewContentEl.innerHTML = `
        <div class="score">Énigme ${previewIndex + 1} / ${currentGame.enigmas.length} · Score : ${previewScore}</div>
        <div class="preview-question">${enigma.text}</div>
        <input id="previewAnswer" class="preview-input" type="text" placeholder="Votre réponse" />
        <div class="actions">
          <button id="checkAnswerBtn" class="btn-primary">Valider</button>
          <button id="nextEnigmaBtn" class="btn-secondary">Suivant</button>
        </div>
        <div id="previewFeedback" class="preview-feedback"></div>
      `;

      const answerInputEl = document.getElementById('previewAnswer');
      const feedbackEl = document.getElementById('previewFeedback');
      const nextBtn = document.getElementById('nextEnigmaBtn');
      nextBtn.disabled = true;
      previewAnswered = false;
      feedbackEl.textContent = '';
      answerInputEl.focus();

      document.getElementById('checkAnswerBtn').addEventListener('click', () => {
        if (previewAnswered) return;

        const answer = (answerInputEl.value || '').trim().toLowerCase();
        const expected = enigma.answer.trim().toLowerCase();

        if (!answer) {
          feedbackEl.textContent = 'Veuillez entrer une réponse.';
          feedbackEl.style.color = '#ff9b8a';
          return;
        }

        if (answer === expected) {
          previewScore += 10;
          previewAnswered = true;
          feedbackEl.textContent = 'Bonne réponse ! +10 points';
          feedbackEl.style.color = '#79f0b7';
          nextBtn.disabled = false;
        } else {
          feedbackEl.textContent = 'Ce n’est pas la bonne réponse. Réessayez !';
          feedbackEl.style.color = '#ff9b8a';
        }
      });

      document.getElementById('nextEnigmaBtn').addEventListener('click', () => {
        previewIndex = (previewIndex + 1) % currentGame.enigmas.length;
        renderPreview();
      });
    }

    function addEnigma() {
      const title = gameTitleInput.value.trim();
      const text = questionInput.value.trim();
      const answer = answerInput.value.trim();

      if (!text || !answer) {
        setStatus('Merci de remplir l’énigme et la réponse.', 'error');
        return;
      }

      currentGame.title = title || 'Mon jeu d’énigmes';
      currentGame.enigmas.push({
        id: Date.now() + Math.random(),
        text,
        answer: answer.toLowerCase()
      });

      saveGame();
      renderList();
      renderPreview();
      questionInput.value = '';
      answerInput.value = '';
      gameTitleInput.value = currentGame.title;
      setStatus('Énigme ajoutée avec succès.', 'success');
    }

    document.getElementById('addEnigmaBtn').addEventListener('click', addEnigma);

    document.getElementById('saveGameBtn').addEventListener('click', () => {
      currentGame.title = gameTitleInput.value.trim() || 'Mon jeu d’énigmes';
      saveGame();
      renderPreview();
      setStatus('Le jeu a bien été enregistré.', 'success');
    });

    document.getElementById('startPreviewBtn').addEventListener('click', () => {
      if (!currentGame.enigmas.length) {
        setStatus('Ajoutez au moins une énigme avant de lancer le test.', 'error');
        return;
      }

      previewIndex = 0;
      previewScore = 0;
      renderPreview();
    });

    listEl.addEventListener('click', (event) => {
      const button = event.target.closest('[data-delete-id]');
      if (!button) return;

      const id = button.getAttribute('data-delete-id');
      currentGame.enigmas = currentGame.enigmas.filter((enigma) => String(enigma.id) !== String(id));
      saveGame();
      renderList();
      renderPreview();
      setStatus('Énigme supprimée.', 'success');
    });

    loadGame();
    renderList();
    renderPreview();
  </script>
</body>
</html>
